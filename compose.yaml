services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: vscode
    working_dir: /workspaces/orm-cxx
    volumes:
      - .:/workspaces/orm-cxx
    command: sleep infinity

  gcc:
    build:
      context: .
      dockerfile: Dockerfile
      target: gcc-dev
    init: true
    user: vscode
    working_dir: /workspaces/orm-cxx
    volumes:
      - .:/workspaces/orm-cxx
    command: sleep infinity

  postgres:
    image: postgres:18
    profiles:
      - postgresql
      - all-backends
    environment:
      POSTGRES_DB: orm_cxx
      POSTGRES_PASSWORD: orm_cxx
      POSTGRES_USER: orm_cxx
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U orm_cxx -d orm_cxx
      interval: 2s
      timeout: 5s
      retries: 20
    ports:
      - "${ORM_CXX_POSTGRESQL_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql

  mysql:
    image: mysql:8.4
    profiles: [mysql, all-backends]
    environment:
      MYSQL_DATABASE: orm_cxx
      MYSQL_ROOT_PASSWORD: orm_cxx
      MYSQL_ROOT_HOST: "%"
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -uroot -porm_cxx --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "${ORM_CXX_MYSQL_PORT:-3306}:3306"
    tmpfs:
      - /var/lib/mysql

  mariadb:
    image: mariadb:11.8
    profiles: [mariadb, all-backends]
    environment:
      MARIADB_DATABASE: orm_cxx
      MARIADB_ROOT_PASSWORD: orm_cxx
      MARIADB_ROOT_HOST: "%"
    healthcheck:
      test: [CMD-SHELL, "healthcheck.sh --connect --innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "${ORM_CXX_MARIADB_PORT:-3307}:3306"
    tmpfs:
      - /var/lib/mysql
