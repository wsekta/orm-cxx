services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: vscode
    working_dir: /workspaces/orm-cxx
    volumes:
      - .:/workspaces/orm-cxx
    command: sleep infinity

  postgres:
    image: postgres:18
    profiles:
      - postgresql
    environment:
      POSTGRES_DB: orm_cxx
      POSTGRES_PASSWORD: orm_cxx
      POSTGRES_USER: orm_cxx
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U orm_cxx -d orm_cxx
      interval: 2s
      timeout: 5s
      retries: 20
    ports:
      - "${ORM_CXX_POSTGRESQL_PORT:-5432}:5432"
    tmpfs:
      - /var/lib/postgresql
