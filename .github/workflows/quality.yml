name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Install formatters
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-format-18
          python -m pip install --disable-pip-version-check --requirement tools/requirements-dev.txt

      - name: Check C++ and CMake formatting
        run: bash ./scripts/check-format.sh

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Clang 18 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang-18 \
            clang-tidy-18 \
            libpq-dev \
            ninja-build \
            sqlite3 \
            libsqlite3-dev

      - name: Run clang-tidy
        run: bash ./scripts/check-tidy.sh

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes doxygen graphviz

      - name: Validate documentation generation
        run: |
          { cat Doxyfile; echo 'HTML_EXTRA_STYLESHEET ='; } | doxygen -
          test -f html/index.html
