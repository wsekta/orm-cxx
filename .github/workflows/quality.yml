name: Quality

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

permissions:
  contents: read

jobs:
  ci-webhook:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/ci-webhook
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/ci-webhook/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Set up Python for Desktop launcher checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check types and webhook delivery
        run: |
          npm run types
          npm run check
          npm test
          npm run test:bridge
          npm run test:transport
          npm run bundle
          python -m unittest discover -s test -p '*_test.py' -v

  macros:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test and enforce the no-macro policy
        run: |
          python -m unittest discover -s tests/macros -v
          python scripts/check-macros.py

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Install formatters
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-format-18
          python -m pip install --disable-pip-version-check --requirement tools/requirements-dev.txt

      - name: Check C++ and CMake formatting
        run: bash ./scripts/check-format.sh

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Clang 18 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang-18 \
            clang-tidy-18 \
            clang-tools-18 \
            libpq-dev \
            libmysqlclient-dev \
            ninja-build \
            sqlite3 \
            libsqlite3-dev

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install module build tools
        run: python -m pip install cmake==3.31.6 ninja==1.13.0
      - name: Run clang-tidy
        run: bash ./scripts/check-tidy.sh

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up documentation tools
        uses: ./.github/actions/setup-docs
      - name: Test documentation regression controls
        run: python -m unittest discover -s tests/docs -v
      - name: Validate documentation generation
        run: python scripts/check_docs.py
      - name: Save checked documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            build/docs/html
            build/docs/warnings.log
