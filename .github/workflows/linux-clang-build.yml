name: Clang coverage

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang 18 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang-18 \
            clang-tools-18 \
            libclang-rt-18-dev \
            llvm-18 \
            lcov \
            ninja-build \
            sqlite3 \
            libsqlite3-dev

      - name: Configure coverage
        run: cmake --preset linux-clang-coverage

      - name: Run tests and generate coverage
        run: cmake --build --preset linux-clang-coverage --target orm-cxx-coverage

      - name: Run full portability profile
        run: ctest --preset linux-clang-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN || secrets.CODECOVTOKEN }}
          files: ${{ github.workspace }}/build/linux-clang-coverage/coverage.lcov
          flags: clang
          name: clang
          disable_search: true
          fail_ci_if_error: true
          verbose: true
