name: GCC

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gcc-15:
    runs-on: ubuntu-24.04
    container: gcc:15-trixie
    timeout-minutes: 40
    name: GCC 15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes \
            python3 python3-venv sqlite3 libsqlite3-dev
          ln -sf /usr/local/bin/gcc /usr/local/bin/gcc-15
          ln -sf /usr/local/bin/g++ /usr/local/bin/g++-15
      - name: Install pinned module build tools
        run: |
          python3 -m venv "$GITHUB_WORKSPACE/.ci-tools"
          "$GITHUB_WORKSPACE/.ci-tools/bin/pip" install cmake==3.31.6 ninja==1.13.0
          printf '%s\n' "$GITHUB_WORKSPACE/.ci-tools/bin" >> "$GITHUB_PATH"
      - name: Build and test
        run: cmake --workflow --preset linux-gcc-15-debug
      - name: Verify installed ORM modules
        shell: bash
        run: |
          readonly prefix="$RUNNER_TEMP/orm-cxx-install"
          readonly consumer="$RUNNER_TEMP/orm-cxx-consumer"
          cmake --install build/linux-gcc-15-debug --prefix "$prefix"
          cmake --install build/linux-gcc-15-debug/externals/soci --prefix "$prefix"
          cmake -S tests/package_consumer -B "$consumer" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-15 \
            "-DCMAKE_PREFIX_PATH=$prefix" \
            -DORM_CXX_EXPECT_SQLITE=ON -DORM_CXX_EXPECT_POSTGRESQL=OFF
          cmake --build "$consumer"
          ctest --test-dir "$consumer" --output-on-failure
      - name: Verify installed reflection without SOCI
        shell: bash
        run: |
          readonly prefix="$RUNNER_TEMP/orm-cxx-install"
          readonly consumer="$RUNNER_TEMP/orm-cxx-reflection-consumer"
          cmake -S tests/reflection_consumer -B "$consumer" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-15 \
            "-DCMAKE_PREFIX_PATH=$prefix" -DCMAKE_DISABLE_FIND_PACKAGE_SOCI=TRUE
          cmake --build "$consumer"
          ctest --test-dir "$consumer" --output-on-failure
