name: GCC

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gcc-14:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: GCC 14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install module build tools
        run: python -m pip install cmake==3.31.6 ninja==1.13.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            gcc-14 g++-14 ninja-build sqlite3 libsqlite3-dev
      - name: Build and test
        run: cmake --workflow --preset linux-gcc-14-debug
