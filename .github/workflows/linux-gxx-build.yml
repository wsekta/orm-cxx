name: GCC

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GCC 13 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            gcc-13 \
            g++-13 \
            ninja-build \
            sqlite3 \
            libsqlite3-dev

      - name: Build and test
        run: cmake --workflow --preset linux-gcc-debug
