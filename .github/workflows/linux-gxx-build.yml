name: GCC

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13
            preset: linux-gcc-debug
            packages: gcc-13 g++-13
          - name: GCC 14
            preset: linux-gcc-14-debug
            packages: gcc-14 g++-14

    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            ${{ matrix.packages }} \
            ninja-build \
            sqlite3 \
            libsqlite3-dev

      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
