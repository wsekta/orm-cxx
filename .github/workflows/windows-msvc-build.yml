name: MSVC

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install module build tools
        run: python -m pip install cmake==3.31.6 ninja==1.13.0
      - name: Configure the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        run: .\externals\vcpkg\bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        run: .\externals\vcpkg\vcpkg.exe install

      - name: Build and test
        run: cmake --workflow --preset msvc-debug

  postgresql-build:
    name: PostgreSQL adapter and consumers
    runs-on: windows-2025-vs2026
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install module build tools
        run: python -m pip install cmake==3.31.6 ninja==1.13.0
      - name: Configure the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        run: .\externals\vcpkg\bootstrap-vcpkg.bat

      - name: Install SQLite and PostgreSQL dependencies
        run: .\externals\vcpkg\vcpkg.exe install --x-feature=postgresql

      - name: Build and test the PostgreSQL-enabled configuration
        run: cmake --workflow --preset msvc-postgresql-debug
