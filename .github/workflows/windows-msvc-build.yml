name: MSVC

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install module build tools
        run: python -m pip install cmake==3.31.6 ninja==1.13.0
      - name: Configure the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        run: .\externals\vcpkg\bootstrap-vcpkg.bat

      - name: Install vcpkg dependencies
        run: .\externals\vcpkg\vcpkg.exe install

      - name: Build and test
        run: cmake --workflow --preset msvc-debug
      - name: Build and run documented SQLite quickstart
        shell: pwsh
        run: |
          cmake -S examples/quickstart -B build/quickstart-msvc -G Ninja -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_TOOLCHAIN_FILE=$PWD/externals/vcpkg/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_MANIFEST_DIR=$PWD" "-DVCPKG_INSTALLED_DIR=$PWD/vcpkg_installed" -DVCPKG_MANIFEST_FEATURES=sqlite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/quickstart-msvc --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/quickstart-msvc --output-on-failure

  backends-build:
    name: All four adapters and 16 consumer subsets
    runs-on: windows-2025-vs2026
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install module build tools
        run: python -m pip install cmake==3.31.6 ninja==1.13.0
      - name: Configure the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        run: .\externals\vcpkg\bootstrap-vcpkg.bat

      - name: Install explicitly selected backend dependencies
        run: .\externals\vcpkg\vcpkg.exe install --x-feature=sqlite --x-feature=postgresql --x-feature=mysql --x-feature=mariadb

      - name: Build and test all adapters and consumer subsets
        run: cmake --workflow --preset msvc-all-backends-debug
