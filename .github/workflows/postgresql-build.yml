          if [ -n "$remaining" ]; then
            echo "PostgreSQL test schemas were not removed: $remaining"
            exit 1
          fi
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN || secrets.CODECOVTOKEN }}
          files: ${{ github.workspace }}/build/linux-clang-postgresql-coverage/coverage.lcov
          flags: linux-clang-postgresql-coverage
          name: PG 18 / Clang 18
          disable_search: true
          fail_ci_if_error: true
          verbose: true

