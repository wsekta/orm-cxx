name: PostgreSQL

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL 15 / GCC 13
            server: 15
            preset: linux-gcc-postgresql
            coverage: false
            compiler_packages: gcc-13 g++-13
          - name: PostgreSQL 15 / GCC 14
            server: 15
            preset: linux-gcc-14-postgresql
            coverage: false
            compiler_packages: gcc-14 g++-14
          - name: PostgreSQL 18 / Clang 18 (coverage)
            server: 18
            preset: linux-clang-postgresql-coverage
            coverage: true
            compiler_packages: clang-18 clang-tools-18 libclang-rt-18-dev llvm-18
          - name: PostgreSQL 18 / Clang 19
            server: 18
            preset: linux-clang-19-postgresql
            coverage: false
            compiler_packages: clang-19 clang-tools-19 libclang-rt-19-dev llvm-19
          - name: PostgreSQL 18 / Clang 20
            server: 18
            preset: linux-clang-20-postgresql
            coverage: false
            compiler_packages: clang-20 clang-tools-20 libclang-rt-20-dev llvm-20

    services:
      postgres:
        image: postgres:${{ matrix.server }}
        env:
          POSTGRES_DB: orm_cxx
          POSTGRES_PASSWORD: orm_cxx
          POSTGRES_USER: orm_cxx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orm_cxx -d orm_cxx"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      ORM_CXX_POSTGRESQL_TEST_DSN: postgresql://host=localhost port=5432 dbname=orm_cxx user=orm_cxx password=orm_cxx
      PGPASSWORD: orm_cxx

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build and PostgreSQL client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            ${{ matrix.compiler_packages }} \
            libpq-dev \
            libsqlite3-dev \
            lcov \
            ninja-build \
            postgresql-client \
            sqlite3

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --parallel 2

      - name: Run the complete profile
        run: ctest --preset ${{ matrix.preset }}

      - name: Repeat PostgreSQL tests
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --no-tests=error --label-regex backend-postgresql

      - name: Verify isolated schemas were removed
        run: |
          remaining="$(psql --host localhost --username orm_cxx --dbname orm_cxx --tuples-only --no-align \
            --command "SELECT schema_name FROM information_schema.schemata WHERE left(schema_name, length('orm_cxx_test_')) = 'orm_cxx_test_';")"
          if [ -n "$remaining" ]; then
            echo "PostgreSQL test schemas were not removed: $remaining"
            exit 1
          fi

      - name: Generate PostgreSQL coverage
        if: matrix.coverage
        run: cmake --build --preset ${{ matrix.preset }} --target orm-cxx-coverage

      - name: Upload PostgreSQL coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN || secrets.CODECOVTOKEN }}
          files: ${{ github.workspace }}/build/${{ matrix.preset }}/coverage.lcov
          flags: ${{ matrix.preset }}
          name: ${{ matrix.name }}
          disable_search: true
          fail_ci_if_error: true
          verbose: true
