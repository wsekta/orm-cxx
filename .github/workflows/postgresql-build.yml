name: PostgreSQL

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pg15-gcc-15:
    runs-on: ubuntu-24.04
    container: public.ecr.aws/docker/library/gcc:15-trixie
    timeout-minutes: 40
    name: PG 15 / GCC 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:15
        env:
          POSTGRES_DB: orm_cxx
          POSTGRES_PASSWORD: orm_cxx
          POSTGRES_USER: orm_cxx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orm_cxx -d orm_cxx"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      ORM_CXX_POSTGRESQL_TEST_DSN: postgresql://host=postgres port=5432 dbname=orm_cxx user=orm_cxx password=orm_cxx
      PGPASSWORD: orm_cxx
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes \
            python3 python3-venv libpq-dev libsqlite3-dev postgresql-client sqlite3
          ln -sf /usr/local/bin/gcc /usr/local/bin/gcc-15
          ln -sf /usr/local/bin/g++ /usr/local/bin/g++-15
      - name: Install pinned module build tools
        run: |
          python3 -m venv "$GITHUB_WORKSPACE/.ci-tools"
          "$GITHUB_WORKSPACE/.ci-tools/bin/pip" install cmake==3.31.6 ninja==1.13.0
          printf '%s\n' "$GITHUB_WORKSPACE/.ci-tools/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset linux-gcc-15-postgresql
      - name: Build
        run: cmake --build build/linux-gcc-15-postgresql --parallel 2
      - name: Test
        run: ctest --preset linux-gcc-15-postgresql
      - name: Repeat PostgreSQL tests
        run: ctest --test-dir build/linux-gcc-15-postgresql --output-on-failure --no-tests=error --label-regex backend-postgresql
      - name: Verify isolated schemas were removed
        run: |
          remaining="$(psql --host postgres --username orm_cxx --dbname orm_cxx --tuples-only --no-align \
            --command "SELECT schema_name FROM information_schema.schemata WHERE left(schema_name, length('orm_cxx_test_')) = 'orm_cxx_test_';")"
          if [ -n "$remaining" ]; then
            echo "PostgreSQL test schemas were not removed: $remaining"
            exit 1
          fi

  pg18-clang-18:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    name: PG 18 / Clang 18
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_DB: orm_cxx
          POSTGRES_PASSWORD: orm_cxx
          POSTGRES_USER: orm_cxx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orm_cxx -d orm_cxx"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      ORM_CXX_POSTGRESQL_TEST_DSN: postgresql://host=localhost port=5432 dbname=orm_cxx user=orm_cxx password=orm_cxx
      PGPASSWORD: orm_cxx
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install module build tools
        run: python -m pip install cmake==3.31.6 ninja==1.13.0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang-18 clang-tools-18 libclang-rt-18-dev llvm-18 \
            libpq-dev libsqlite3-dev lcov ninja-build postgresql-client sqlite3
      - name: Configure
        run: cmake --preset linux-clang-postgresql-coverage
      - name: Build and generate coverage
        run: cmake --build --preset linux-clang-postgresql-coverage --target orm-cxx-coverage
      - name: Generate SQLite coverage from the same commit
        run: |
          cmake --preset linux-clang-coverage
          cmake --build --preset linux-clang-coverage --target orm-cxx-coverage --parallel 2
      - name: Test
        run: ctest --preset linux-clang-postgresql-coverage
      - name: Test SQLite profile
        run: ctest --preset linux-clang-coverage
      - name: Repeat PostgreSQL tests
        run: ctest --test-dir build/linux-clang-postgresql-coverage --output-on-failure --no-tests=error --label-regex backend-postgresql
      - name: Verify isolated schemas were removed
        run: |
          remaining="$(psql --host localhost --username orm_cxx --dbname orm_cxx --tuples-only --no-align \
            --command "SELECT schema_name FROM information_schema.schemata WHERE left(schema_name, length('orm_cxx_test_')) = 'orm_cxx_test_';")"
          if [ -n "$remaining" ]; then
            echo "PostgreSQL test schemas were not removed: $remaining"
            exit 1
          fi
      - name: Test coverage exporter and merger
        run: python3 -m unittest discover -s tests/coverage -v
      - name: Require 100% merged line coverage
        run: |
          python3 scripts/check_merged_coverage.py \
            build/linux-clang-coverage/coverage.lcov \
            build/linux-clang-postgresql-coverage/coverage.lcov \
            --source-root . --output build/coverage-merged.lcov
      - name: Archive coverage for this commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            build/linux-clang-coverage/coverage.lcov
            build/linux-clang-postgresql-coverage/coverage.lcov
            build/coverage-merged.lcov
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN || secrets.CODECOVTOKEN }}
          files: ${{ github.workspace }}/build/coverage-merged.lcov
          flags: linux-clang-postgresql-coverage
          name: PG 18 / Clang 18
          disable_search: true
          fail_ci_if_error: true
          verbose: true

