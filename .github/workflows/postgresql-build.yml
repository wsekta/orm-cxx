name: Backend conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: All backends / Clang ${{ matrix.clang }} / PG ${{ matrix.pg }} / MySQL ${{ matrix.mysql }} / MariaDB ${{ matrix.mariadb }}
    strategy:
      fail-fast: false
      matrix:
        clang: [18, 19, 20]
        include:
          - clang: 18
            pg: '15'
            mysql: '8.4'
            mariadb: '11.4'
          - clang: 19
            pg: '18'
            mysql: '9.7'
            mariadb: '12.3'
          - clang: 20
            pg: '18'
            mysql: '8.4'
            mariadb: '11.8'
    services:
      postgres:
        image: postgres:${{ matrix.pg || '18' }}
        env:
          POSTGRES_DB: orm_cxx
          POSTGRES_USER: orm_cxx
          POSTGRES_PASSWORD: orm_cxx
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orm_cxx -d orm_cxx"
          --health-interval 2s --health-timeout 5s --health-retries 40
      mysql:
        image: mysql:${{ matrix.mysql || '8.4' }}
        env:
          MYSQL_DATABASE: orm_cxx
          MYSQL_ROOT_PASSWORD: orm_cxx
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping --host=localhost --user=root --password=orm_cxx"
          --health-interval 2s --health-timeout 5s --health-retries 60
      mariadb:
        image: mariadb:${{ matrix.mariadb || '11.8' }}
        env:
          MARIADB_DATABASE: orm_cxx
          MARIADB_ROOT_PASSWORD: orm_cxx
          MARIADB_ROOT_HOST: '%'
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      ORM_CXX_POSTGRESQL_TEST_HOST: localhost
      ORM_CXX_POSTGRESQL_TEST_PORT: "5432"
      ORM_CXX_POSTGRESQL_TEST_DATABASE: orm_cxx
      ORM_CXX_POSTGRESQL_TEST_USER: orm_cxx
      ORM_CXX_POSTGRESQL_TEST_PASSWORD: orm_cxx
      ORM_CXX_MYSQL_TEST_HOST: 127.0.0.1
      ORM_CXX_MYSQL_TEST_PORT: "3306"
      ORM_CXX_MYSQL_TEST_DATABASE: orm_cxx
      ORM_CXX_MYSQL_TEST_USER: root
      ORM_CXX_MYSQL_TEST_PASSWORD: orm_cxx
      ORM_CXX_MARIADB_TEST_HOST: 127.0.0.1
      ORM_CXX_MARIADB_TEST_PORT: "3307"
      ORM_CXX_MARIADB_TEST_DATABASE: orm_cxx
      ORM_CXX_MARIADB_TEST_USER: root
      ORM_CXX_MARIADB_TEST_PASSWORD: orm_cxx
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install module build tools
        run: python -m pip install cmake==3.31.6 ninja==1.13.0
      - name: Install selected client libraries and compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-${{ matrix.clang }} clang-tools-${{ matrix.clang }} libclang-rt-${{ matrix.clang }}-dev llvm-${{ matrix.clang }} openssl socat libpq-dev libsqlite3-dev libmysqlclient-dev
      - name: Provision required password, anonymous and verified TLS profiles
        run: |
          python3 scripts/provision_connection_tests.py \
            --postgres-container '${{ job.services.postgres.id }}' \
            --mysql-container '${{ job.services.mysql.id }}' \
            --mariadb-container '${{ job.services.mariadb.id }}' \
            --output "$RUNNER_TEMP/orm-cxx-connection-tls"
      - name: Configure all four adapters
        run: |
          preset=linux-clang-all-backends
          if [ '${{ matrix.clang }}' != '18' ]; then preset=linux-clang-${{ matrix.clang }}-all-backends; fi
          cmake --preset "$preset"
          echo "BACKEND_PRESET=$preset" >> "$GITHUB_ENV"
      - name: Build and run conformance, compile contracts and 16 consumer subsets
        run: |
          cmake --build --preset "$BACKEND_PRESET" --parallel 2
          ctest --preset "$BACKEND_PRESET"

  gcc:
    runs-on: ubuntu-24.04
    container: gcc:15-trixie
    timeout-minutes: 120
    name: All backends / GCC 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: orm_cxx
          POSTGRES_USER: orm_cxx
          POSTGRES_PASSWORD: orm_cxx
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orm_cxx -d orm_cxx"
          --health-interval 2s --health-timeout 5s --health-retries 40
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: orm_cxx
          MYSQL_ROOT_PASSWORD: orm_cxx
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping --host=localhost --user=root --password=orm_cxx"
          --health-interval 2s --health-timeout 5s --health-retries 60
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: orm_cxx
          MARIADB_ROOT_PASSWORD: orm_cxx
          MARIADB_ROOT_HOST: '%'
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      ORM_CXX_POSTGRESQL_TEST_HOST: postgres
      ORM_CXX_POSTGRESQL_TEST_PORT: "5432"
      ORM_CXX_POSTGRESQL_TEST_DATABASE: orm_cxx
      ORM_CXX_POSTGRESQL_TEST_USER: orm_cxx
      ORM_CXX_POSTGRESQL_TEST_PASSWORD: orm_cxx
      ORM_CXX_MYSQL_TEST_HOST: mysql
      ORM_CXX_MYSQL_TEST_PORT: "3306"
      ORM_CXX_MYSQL_TEST_DATABASE: orm_cxx
      ORM_CXX_MYSQL_TEST_USER: root
      ORM_CXX_MYSQL_TEST_PASSWORD: orm_cxx
      ORM_CXX_MARIADB_TEST_HOST: mariadb
      ORM_CXX_MARIADB_TEST_PORT: "3306"
      ORM_CXX_MARIADB_TEST_DATABASE: orm_cxx
      ORM_CXX_MARIADB_TEST_USER: root
      ORM_CXX_MARIADB_TEST_PASSWORD: orm_cxx
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install selected dependencies and pinned build tools
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes python3 python3-venv docker-cli openssl socat libpq-dev libsqlite3-dev
          # The GitHub runner mounts /var/run/docker.sock into its job container.
          test -S /var/run/docker.sock
          docker info >/dev/null
          sh scripts/install_mysql_client_debian.sh
          ln -sf /usr/local/bin/gcc /usr/local/bin/gcc-15
          ln -sf /usr/local/bin/g++ /usr/local/bin/g++-15
          python3 -m venv .ci-tools
          .ci-tools/bin/pip install cmake==3.31.6 ninja==1.13.0
          printf '%s\n' "$GITHUB_WORKSPACE/.ci-tools/bin" >> "$GITHUB_PATH"
      - name: Provision required password, anonymous and verified TLS profiles
        run: |
          python3 scripts/provision_connection_tests.py \
            --postgres-container '${{ job.services.postgres.id }}' \
            --mysql-container '${{ job.services.mysql.id }}' \
            --mariadb-container '${{ job.services.mariadb.id }}' \
            --output "$RUNNER_TEMP/orm-cxx-connection-tls"
      - name: Build and run conformance, compile contracts and 16 consumer subsets
        run: cmake --workflow --preset linux-gcc-15-all-backends

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    name: Core and four equal coverage profiles / Clang 18
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: orm_cxx
          POSTGRES_USER: orm_cxx
          POSTGRES_PASSWORD: orm_cxx
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orm_cxx -d orm_cxx"
          --health-interval 2s --health-timeout 5s --health-retries 40
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: orm_cxx
          MYSQL_ROOT_PASSWORD: orm_cxx
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping --host=localhost --user=root --password=orm_cxx"
          --health-interval 2s --health-timeout 5s --health-retries 60
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: orm_cxx
          MARIADB_ROOT_PASSWORD: orm_cxx
          MARIADB_ROOT_HOST: '%'
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      ORM_CXX_POSTGRESQL_TEST_HOST: localhost
      ORM_CXX_POSTGRESQL_TEST_PORT: "5432"
      ORM_CXX_POSTGRESQL_TEST_DATABASE: orm_cxx
      ORM_CXX_POSTGRESQL_TEST_USER: orm_cxx
      ORM_CXX_POSTGRESQL_TEST_PASSWORD: orm_cxx
      ORM_CXX_MYSQL_TEST_HOST: 127.0.0.1
      ORM_CXX_MYSQL_TEST_PORT: "3306"
      ORM_CXX_MYSQL_TEST_DATABASE: orm_cxx
      ORM_CXX_MYSQL_TEST_USER: root
      ORM_CXX_MYSQL_TEST_PASSWORD: orm_cxx
      ORM_CXX_MARIADB_TEST_HOST: 127.0.0.1
      ORM_CXX_MARIADB_TEST_PORT: "3307"
      ORM_CXX_MARIADB_TEST_DATABASE: orm_cxx
      ORM_CXX_MARIADB_TEST_USER: root
      ORM_CXX_MARIADB_TEST_PASSWORD: orm_cxx
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install module build tools
        run: python -m pip install cmake==3.31.6 ninja==1.13.0
      - name: Install compiler, coverage tools and selected clients
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang-18 clang-tools-18 libclang-rt-18-dev llvm-18 lcov openssl socat libpq-dev libsqlite3-dev libmysqlclient-dev
      - name: Provision required password, anonymous and verified TLS profiles
        run: |
          python3 scripts/provision_connection_tests.py \
            --postgres-container '${{ job.services.postgres.id }}' \
            --mysql-container '${{ job.services.mysql.id }}' \
            --mariadb-container '${{ job.services.mariadb.id }}' \
            --output "$RUNNER_TEMP/orm-cxx-connection-tls"
      - name: Test coverage exporter and merger
        run: python -m unittest discover -s tests/coverage -v
      - name: Generate independent coverage reports
        run: |
          for preset in linux-clang-coverage linux-clang-sqlite-coverage linux-clang-postgresql-coverage linux-clang-mysql-coverage linux-clang-mariadb-coverage; do
            cmake --preset "$preset"
            cmake --build --preset "$preset" --target orm-cxx-coverage --parallel 2
            # Compiler contracts and all 16 installed consumer subsets run in the all-backends jobs above.
            # These profiles repeat runtime tests with independent instrumentation, without rebuilding those consumers.
            ctest --preset "$preset" --exclude-regex 'orm-cxx-(consumer-|compile-fail)'
          done
      - name: Require 100% merged line coverage
        run: |
          python scripts/check_merged_coverage.py \
            build/linux-clang-coverage/coverage.lcov \
            build/linux-clang-sqlite-coverage/coverage.lcov \
            build/linux-clang-postgresql-coverage/coverage.lcov \
            build/linux-clang-mysql-coverage/coverage.lcov \
            build/linux-clang-mariadb-coverage/coverage.lcov \
            --source-root . --output build/coverage-merged.lcov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: |
            build/linux-clang*-coverage/coverage.lcov
            build/coverage-merged.lcov
          if-no-files-found: warn
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN || secrets.CODECOVTOKEN }}
          files: ${{ github.workspace }}/build/coverage-merged.lcov
          flags: all-backends
          name: Core and four backends
          disable_search: true
          fail_ci_if_error: true
