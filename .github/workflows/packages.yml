name: Packages

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release halfway through publishing or creating submissions.
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release automation
        run: |
          python -m pip install -r tools/requirements-packaging.txt
          python -m unittest discover -s tests/packaging -v
      - name: Check release submission configuration
        if: github.ref == 'refs/heads/release' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          CONANCENTER_ISSUE: ${{ vars.CONANCENTER_ISSUE }}
          PACKAGE_REGISTRY_OWNER: wsekta
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Set PACKAGE_REGISTRY_TOKEN before releasing; see docs/packaging.md.'
            exit 1
          fi
          python scripts/publish_packages.py preflight
      - name: Prepare source archive and central catalog recipes
        id: prepare
        run: python scripts/prepare_packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: package-distribution
          path: build/distribution
          if-no-files-found: error

  test:
    needs: prepare
    name: ${{ matrix.manager }} / ${{ matrix.os }} / ${{ matrix.backends }} / ${{ matrix.triplet || 'default' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
        manager: [conan, vcpkg]
        backends: [sqlite, both, core, postgresql]
        triplet: [default]
        include:
          - os: windows-2025-vs2026
            manager: vcpkg
            backends: sqlite
            triplet: x64-windows
          - os: windows-2025-vs2026
            manager: vcpkg
            backends: both
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CONAN_HOME: ${{ github.workspace }}/build/conan-home
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_BINARY_SOURCES: clear
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install package tools
        run: python -m pip install -r tools/requirements-packaging.txt cmake==3.31.6
      - uses: actions/download-artifact@v4
        with:
          name: package-distribution
          path: build/distribution
      - name: Install the supported Linux compiler
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes clang-18 clang-tools-18 g++-14
      - name: Select the supported Linux compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
      - name: Install vcpkg host prerequisites on Linux
        if: matrix.manager == 'vcpkg' && runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes pkg-config
      - name: Initialize pinned vcpkg on Linux
        if: matrix.manager == 'vcpkg' && runner.os == 'Linux'
        shell: bash
        run: |
          git submodule update --init externals/vcpkg
          ./externals/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Initialize pinned vcpkg on Windows
        if: matrix.manager == 'vcpkg' && runner.os == 'Windows'
        shell: cmd
        run: |
          git submodule update --init externals/vcpkg
          call .\externals\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Build package and run installed consumer
        run: python scripts/check_packages.py --manager ${{ matrix.manager }} --backends ${{ matrix.backends }} ${{ matrix.triplet != 'default' && format('--triplet {0}', matrix.triplet) || '' }}
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.manager }}-${{ matrix.os }}-${{ matrix.backends }}
          path: |
            build/**/CMakeConfigureLog.yaml
            build/**/LastTest.log
            externals/vcpkg/buildtrees/**/*.log

  release:
    if: github.ref == 'refs/heads/release' && github.event_name != 'pull_request'
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package tools
        run: python -m pip install -r tools/requirements-packaging.txt cmake==3.31.6
      - name: Check central catalog credentials
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          CONANCENTER_ISSUE: ${{ vars.CONANCENTER_ISSUE }}
          PACKAGE_REGISTRY_OWNER: wsekta
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Set PACKAGE_REGISTRY_TOKEN before releasing; see docs/packaging.md.'
            exit 1
          fi
          python scripts/publish_packages.py preflight
      - uses: actions/download-artifact@v4
        with:
          name: package-distribution
          path: build/distribution
      - name: Publish verified immutable sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_packages.py release --distribution build/distribution

  submit:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        manager: [vcpkg, conan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-packaging.txt cmake==3.31.6
      - uses: actions/download-artifact@v4
        with:
          name: package-distribution
          path: build/distribution
      - name: Submit to the official catalog
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
          CONANCENTER_ISSUE: ${{ vars.CONANCENTER_ISSUE }}
          PACKAGE_REGISTRY_OWNER: wsekta
        run: python scripts/publish_packages.py ${{ matrix.manager }} --distribution build/distribution
